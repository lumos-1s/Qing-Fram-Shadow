# Build a Windows release on GitHub-hosted runners, sign it with SignPath
# Foundation, refresh the updater metadata from the signed installer, verify it,
# and create a DRAFT GitHub Release.
#
# A draft is invisible to electron-updater's /releases/latest endpoint, so the
# real old-version auto-update test has to happen after the draft is published.
#
# SignPath side (one-time setup): see signpath/README.md.
# Every release needs two manual approvals in SignPath: the app executable,
# then the installer/portable pair.
name: Release (SignPath signed)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.21 (must match package.json version)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-signpath-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Run this workflow from main. Current ref: ${{ github.ref }}"
          }

          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version must be MAJOR.MINOR.PATCH, got: $version"
          }
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Input tag '$env:RELEASE_TAG' does not match package.json version 'v$version'."
          }

          git fetch --tags --force | Out-Null
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify --quiet $tagRef
          if ($LASTEXITCODE -eq 0) {
            $tagSha = git rev-parse "$tagRef^{commit}"
            if ($tagSha -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG points to $tagSha, not the current commit $env:GITHUB_SHA."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$($version).0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check release is not already published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existingJson = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $isDraft = ($existingJson | ConvertFrom-Json).isDraft
            if (-not $isDraft) {
              throw "Release $env:RELEASE_TAG is already published. Bump package.json before building."
            }
            Write-Host "Existing draft release will be updated: $env:RELEASE_TAG"
          } else {
            Write-Host "No existing release for $env:RELEASE_TAG."
          }

      - name: Check SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_CONFIG_SLUG: ${{ vars.SIGNPATH_APP_CONFIG_SLUG }}
          SIGNPATH_INSTALLER_CONFIG_SLUG: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG }}
        run: |
          $names = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG',
            'SIGNPATH_APP_CONFIG_SLUG',
            'SIGNPATH_INSTALLER_CONFIG_SLUG'
          )
          $missing = @()
          foreach ($name in $names) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value)) { $missing += $name }
          }
          if ($missing.Count -gt 0) {
            throw "Missing repository secret/variable(s): $($missing -join ', '). See signpath/README.md."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      - name: Build unpacked application
        shell: pwsh
        run: |
          npx electron-builder --win dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = 'dist\win-unpacked\Qingframe.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing $exe" }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned app executable before SignPath, got $($signature.Status)."
          }

          New-Item -ItemType Directory -Force -Path 'signpath\app' | Out-Null
          Copy-Item -LiteralPath $exe -Destination 'signpath\app\Qingframe.exe' -Force

      - name: Upload unsigned app for SignPath
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: qingframe-app-unsigned-${{ steps.version.outputs.version }}
          path: signpath/app/Qingframe.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign app executable with SignPath
        id: sign-app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          service-unavailable-timeout-in-seconds: 900
          download-signed-artifact-timeout-in-seconds: 900
          output-artifact-directory: signpath/app-signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"
            app-version: "${{ steps.version.outputs.app_version }}"

      - name: Verify and install signed app
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path 'signpath\app-signed' -Recurse -File -Filter 'Qingframe.exe' |
            Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return Qingframe.exe.' }

          $signature = Get-AuthenticodeSignature -LiteralPath $signed.FullName
          Write-Host ("Signed app: {0} | {1}" -f $signature.Status, $signature.SignerCertificate.Subject)
          if ($signature.Status -ne 'Valid') {
            throw "Signed app is not valid: $($signature.Status)"
          }
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch 'CN=SignPath Foundation') {
            throw 'Signed app was not signed by SignPath Foundation.'
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'Signed app has no timestamp.'
          }

          Copy-Item -LiteralPath $signed.FullName -Destination 'dist\win-unpacked\Qingframe.exe' -Force

      - name: Write updater configuration into signed app
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path 'signpath\app-signed' -Recurse -File -Filter 'Qingframe.exe' |
            Select-Object -First 1
          if (-not $signed) { throw 'Signed Qingframe.exe is missing.' }
          $publisher = (Get-AuthenticodeSignature -LiteralPath $signed.FullName).SignerCertificate.Subject
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw 'Signed app has no signer subject.' }

          node tools/prepare-app-update.js --publisher-name $publisher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $appUpdate = 'dist\win-unpacked\resources\app-update.yml'
          if (-not (Test-Path -LiteralPath $appUpdate)) { throw "Missing $appUpdate" }
          $appUpdateText = Get-Content -LiteralPath $appUpdate -Raw
          if ($appUpdateText -notmatch 'publisherName:' -or $appUpdateText -notmatch 'SignPath Foundation') {
            throw 'app-update.yml does not pin the SignPath Foundation publisher.'
          }

      - name: Build installers from signed app
        shell: pwsh
        run: |
          npx electron-builder --win nsis --win portable --x64 --prepackaged dist\win-unpacked --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = "dist\Qingframe-Setup-$env:APP_VERSION-x64.exe"
          $portable = "dist\Qingframe-Portable-$env:APP_VERSION-x64.exe"
          foreach ($file in @($setup, $portable)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing $file" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected an unsigned installer before SignPath: $file ($($signature.Status))"
            }
          }

          if (-not (Test-Path -LiteralPath 'dist\latest.yml')) { throw 'Missing dist\latest.yml' }

          $appUpdate = 'dist\win-unpacked\resources\app-update.yml'
          $appUpdateText = Get-Content -LiteralPath $appUpdate -Raw
          if ($appUpdateText -notmatch 'publisherName:' -or $appUpdateText -notmatch 'SignPath Foundation') {
            throw 'app-update.yml does not pin the SignPath Foundation publisher after packaging.'
          }

          New-Item -ItemType Directory -Force -Path 'signpath\installers' | Out-Null
          Copy-Item -LiteralPath $setup -Destination 'signpath\installers' -Force
          Copy-Item -LiteralPath $portable -Destination 'signpath\installers' -Force

      - name: Upload unsigned installers for SignPath
        id: upload-installers
        uses: actions/upload-artifact@v4
        with:
          name: qingframe-installers-unsigned-${{ steps.version.outputs.version }}
          path: |
            signpath/installers/Qingframe-Setup-*.exe
            signpath/installers/Qingframe-Portable-*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installers with SignPath
        id: sign-installers
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          service-unavailable-timeout-in-seconds: 900
          download-signed-artifact-timeout-in-seconds: 900
          output-artifact-directory: signpath/installers-signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Verify and install signed installers
        shell: pwsh
        run: |
          $signedRoot = 'signpath\installers-signed'
          $signedFiles = @(Get-ChildItem -Path $signedRoot -Recurse -File -Filter '*.exe')
          foreach ($name in @(
            "Qingframe-Setup-$env:APP_VERSION-x64.exe",
            "Qingframe-Portable-$env:APP_VERSION-x64.exe"
          )) {
            $signed = $signedFiles | Where-Object { $_.Name -eq $name } | Select-Object -First 1
            if (-not $signed) { throw "SignPath did not return $name." }

            $signature = Get-AuthenticodeSignature -LiteralPath $signed.FullName
            Write-Host ("Signed installer: {0} | {1}" -f $signature.Status, $signature.SignerCertificate.Subject)
            if ($signature.Status -ne 'Valid') {
              throw "$name is not validly signed: $($signature.Status)"
            }
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch 'CN=SignPath Foundation') {
              throw "$name was not signed by SignPath Foundation."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$name has no timestamp."
            }

            Copy-Item -LiteralPath $signed.FullName -Destination (Join-Path 'dist' $name) -Force
          }

      - name: Refresh updater metadata from signed installer
        shell: pwsh
        run: |
          node tools/refresh-release-metadata.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node tools/verify-dist.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node tools/verify-dist.js --installers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify-signatures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qingframe-signed-release-${{ steps.version.outputs.version }}
          path: |
            dist/Qingframe-Setup-${{ steps.version.outputs.version }}-x64.exe
            dist/Qingframe-Setup-${{ steps.version.outputs.version }}-x64.exe.blockmap
            dist/Qingframe-Portable-${{ steps.version.outputs.version }}-x64.exe
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

      - name: Write release notes
        shell: pwsh
        run: |
          $setup = "dist\Qingframe-Setup-$env:APP_VERSION-x64.exe"
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          $body = @(
            'Windows builds are signed by **SignPath Foundation**.',
            '',
            'Setup, Portable, and the application executable carry the signature. The NSIS uninstaller generated at install time and helper executables are not separately signed.',
            '',
            'Free code signing provided by SignPath.io, certificate by SignPath Foundation.',
            '',
            "Code signing policy: https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md",
            "Privacy policy: https://github.com/${{ github.repository }}/blob/main/PRIVACY.md",
            '',
            "Built from commit ``$env:GITHUB_SHA``.",
            '',
            "Installer SHA-256: ``$sha256``"
          ) -join "`n"
          $body | Out-File -FilePath "$env:RUNNER_TEMP\release-notes.md" -Encoding utf8

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(
            "dist\Qingframe-Setup-$env:APP_VERSION-x64.exe",
            "dist\Qingframe-Setup-$env:APP_VERSION-x64.exe.blockmap",
            "dist\Qingframe-Portable-$env:APP_VERSION-x64.exe",
            'dist\latest.yml'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }

          $existingJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $isDraft = ($existingJson | ConvertFrom-Json).isDraft
            if (-not $isDraft) {
              throw "Release $tag is already published. Bump the version instead of overwriting a live release."
            }
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "Qingframe $tag" --notes-file "$env:RUNNER_TEMP\release-notes.md"
          } else {
            gh release create $tag --draft --title "Qingframe $tag" `
              --target $env:GITHUB_SHA `
              --notes-file "$env:RUNNER_TEMP\release-notes.md" `
              @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Draft release: https://github.com/${{ github.repository }}/releases/tag/$tag"
