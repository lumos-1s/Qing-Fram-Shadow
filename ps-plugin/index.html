<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>清框影 · PS 桥接 PoC</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="wrap">
    <h3>清框影 · 加边框 <span>PoC</span></h3>
    <p class="note">把当前选中图层套上边框，作为新图层放回文档。</p>
    <label>风格</label>
    <select id="preset"></select>
    <label>输出色域</label>
    <select id="selColorSpace">
      <option value="adobergb" selected>Adobe RGB (1998)</option>
      <option value="srgb">sRGB</option>
    </select>
    <details id="exifPanel">
      <summary>相机参数（自动识别）</summary>
      <div id="exifText" class="exif-text">未识别</div>
      <label class="exif-auto"><input id="chkExifAuto" type="checkbox" checked> 写入参数条</label>
    </details>
    <div id="borderParams" class="params"></div>
    <div class="acts">
      <button id="btnBorder" class="primary">套用边框 → 新图层</button>
    </div>
    <pre id="log"></pre>
  </div>

  <canvas id="renderCanvas" hidden></canvas>

  <script src="lib/CSInterface.js"></script>
  <script src="lib/Vulcan.js"></script>
  <script src="js/app-stub.js"></script>
  <script src="js/presets-bundle.js"></script>
  <script src="js/style-params.js"></script>
  <script src="js/style-caps.js"></script>
<script src="js/border-params.js"></script>
  <script src="js/color-space.js"></script>
<script src="lib/icc-adobergb.js"></script>
<script src="js/icc-embed.js"></script>
  <script src="js/qfs-img.js"></script>
  <script src="js/exif.js"></script>
  <script src="js/focal-eq.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/engine-styles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
