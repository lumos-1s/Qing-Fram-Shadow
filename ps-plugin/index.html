<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>清框影 · PS 桥接 PoC</title>
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h3>清框影 · 加边框 <span>PoC</span></h3>
      <p class="note">取当前文档合成，套边框后作为新图层放回。</p>
    </div>

    <div class="wall-head">
      <label for="presetSearch">风格</label>
      <span id="presetCount" class="count">0</span>
    </div>
    <input id="presetSearch" type="search" placeholder="搜索风格，如「拍立得」「背景模糊」" autocomplete="off">
    <div id="presetWall" class="wall"></div>
    <p id="wallEmpty" class="note" hidden>没有匹配的风格</p>
    <select id="preset" hidden></select>

    <div class="preview-box">
      <canvas id="previewCanvas" class="preview"></canvas>
      <div id="previewMeta" class="preview-meta">选择风格后显示预览</div>
    </div>

    <div id="borderParams" class="params"></div>
    <div id="textParams" class="params"></div>

    <details id="exifPanel">
      <summary>相机参数（自动识别，可修改）</summary>
      <div id="exifFields" class="exif-fields"></div>
      <label class="exif-auto"><input id="chkExifAuto" type="checkbox" checked> 写入参数条</label>
      <div class="text-acts"><button id="btnExifDetect" type="button">重新识别</button></div>
    </details>

    <details id="outputPanel" open>
      <summary>输出</summary>
      <label for="selColorSpace">色彩空间</label>
      <select id="selColorSpace">
        <option value="adobergb" selected>Adobe RGB (1998)</option>
        <option value="p3">Display P3</option>
        <option value="srgb">sRGB</option>
      </select>
      <label class="exif-auto"><input id="chkSmart" type="checkbox" checked> 作为智能对象放入</label>
      <label class="exif-auto"><input id="chkHideSrc" type="checkbox" checked> 套用后隐藏原图层</label>
    </details>

    <div class="acts sticky">
      <button id="btnReset" type="button" class="secondary">重置参数</button>
      <button id="btnBorder" class="primary">套用边框 → 新图层</button>
    </div>
    <div id="status" class="status"></div>

    <details id="logPanel">
      <summary>运行日志</summary>
      <pre id="log"></pre>
    </details>
  </div>

  <canvas id="renderCanvas" hidden></canvas>

  <script src="lib/CSInterface.js"></script>
  <script src="lib/Vulcan.js"></script>
  <script src="js/app-stub.js"></script>
  <script src="js/presets-bundle.js"></script>
  <script src="js/style-params.js"></script>
  <script src="js/style-caps.js"></script>
<script src="js/border-params.js"></script>
<script src="js/text-params.js"></script>
  <script src="js/color-space.js"></script>
<script src="lib/icc-adobergb.js"></script>
<script src="lib/icc-p3.js"></script>
<script src="js/icc-embed.js"></script>
  <script src="js/qfs-img.js"></script>
  <script src="js/exif.js"></script>
  <script src="js/focal-eq.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/engine-styles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
