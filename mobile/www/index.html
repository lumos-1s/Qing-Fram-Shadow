<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#181B1A">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'">
<title>清框影 · 手机版</title>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">
  <header id="mHeader">
    <button id="btnThumb" class="hdr-thumb" type="button" aria-label="照片库">
      <img id="hdrThumb" alt="">
    </button>
    <div class="hdr-title">
      <b id="hdrName">清框影</b>
      <small id="hdrMeta">先导入一张照片</small>
    </div>
    <div class="header-acts">
      <button id="btnPick" class="icon-btn" aria-label="导入照片" title="导入照片">＋</button>
      <button id="btnSettings" class="icon-btn" aria-label="设置" title="设置">⚙</button>
      <button id="btnExport" class="export-btn" type="button">导出</button>
    </div>
  </header>

  <main id="mMain">
    <section id="stage">
      <canvas id="previewCanvas"></canvas>
      <textarea id="textEditor" hidden spellcheck="false" aria-label="编辑文字"></textarea>
      <div id="toast" hidden role="status"></div>
      <div id="stageEmpty" class="empty-hint">
        <div class="empty-ico">▧</div>
        <b>先导入一张照片</b>
        <span>点右上角的 ＋ 选图</span>
      </div>
    </section>

    <section id="sheet" class="half" aria-label="编辑面板">
      <div id="sheetHandle" role="button" tabindex="0" aria-label="展开或收起面板">
        <span></span>
      </div>
      <nav id="tabs" aria-label="主功能">
        <button class="tab active" data-tab="style"><span class="ico">✦</span>风格</button>
        <button class="tab" data-tab="edit"><span class="ico">✎</span>编辑</button>
        <button class="tab" data-tab="puzzle"><span class="ico">▤</span>拼图</button>
        <button class="tab" data-tab="grade"><span class="ico">◐</span>调色</button>
        <button class="tab" data-tab="crop"><span class="ico">▦</span>切图</button>
      </nav>
      <section id="panel" aria-live="polite"></section>
    </section>
  </main>
</div>

<!-- 引擎与算法：与桌面端同源，由 tools/sync-mobile-engine.js 同步，禁止手改 -->
<div id="gridControls" hidden aria-hidden="true">
  <select id="selGridSize"><option value="3" selected>3</option></select>
  <input id="inpGridCols" value="3">
  <input id="inpGridRows" value="3">
  <input id="slGridPad" value="0">
  <input id="slGridOffsetX" value="0">
  <input id="slGridOffsetY" value="0">
</div>
<script src="js/capacitor.js"></script>
<script src="js/default-template.js"></script>
<script src="js/presets-bundle.js"></script>
<script src="js/wall-data.js"></script>
<script src="js/heic-bridge.js"></script>
<script src="js/native.js"></script>
<script src="js/app-stub.js"></script>
<script src="js/app-auto-grade.js"></script>
<script src="js/app-grade.js"></script>
<script src="js/app-histogram.js"></script>
<script src="js/app-export.js"></script>
<script src="js/color-space.js"></script>
<script src="js/qfs-img.js"></script>
<script src="js/exif.js"></script>
<script src="js/focal-eq.js"></script>
<script src="js/presets.js"></script>
<script src="js/style-caps.js"></script>
<script src="js/style-params.js"></script>
<script src="js/engine.js"></script>
<script src="js/engine-styles.js"></script>
<script type="module" src="js/raw-bridge.js"></script>
<script src="js/fullres.js"></script>
<script src="js/edit-panel.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
