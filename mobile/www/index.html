<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0C0B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'">
  <title>清框影</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app" data-page="home">
  <header id="mHeader">
    <button id="btnBack" class="icon-btn back-btn" type="button" aria-label="返回">‹</button>
    <button id="hdrThumb" class="hdr-thumb" type="button" aria-label="回到编辑"><img id="hdrThumbImg" alt=""></button>
    <div class="hdr-title">
      <b id="hdrName">清框影</b>
      <small id="hdrMeta">为摄影爱好者提供最好的边框</small>
    </div>
    <div class="header-acts">
      <button id="btnPick" class="icon-btn" aria-label="导入照片" title="导入照片">＋</button>
      <button id="btnSettings" class="icon-btn" aria-label="我的" title="我的">◍</button>
      <button id="btnExport" class="export-btn" type="button">导出</button>
    </div>
  </header>

  <!-- ── 首页：发现风格 ─────────────────────────────────────────── -->
  <main id="pageHome" class="page home-page">
    <div class="home-scroll" id="homeScroll">
      <div class="home-search">
        <input id="homeQuery" type="search" enterkeyhint="search" placeholder="搜风格或分类，如 拍立得 / 胶片">
      </div>
      <div id="homeHero" class="home-hero"></div>
      <div id="homeSections"></div>
      <p class="home-foot">照片全程本地处理 · 不上传、不需要账号</p>
    </div>
  </main>

  <!-- ── 编辑页：画布 + 照片条 + 工具轨 + 面板 ──────────────────── -->
  <main id="pageEdit" class="page edit-page" hidden>
    <section id="stage">
      <canvas id="previewCanvas"></canvas>
      <textarea id="textEditor" hidden spellcheck="false" aria-label="编辑文字"></textarea>
      <div id="stageEmpty" class="empty-hint">
        <div class="empty-ico">▧</div>
        <b>先导入一张照片</b>
        <span>点右上角的 ＋ 选图</span>
      </div>
      <!-- 撤销/重做贴着画布：顶栏让位给标题和导出，历史操作也离画面更近 -->
      <div id="historyDock" hidden>
        <button id="btnUndo" type="button" aria-label="撤销" title="撤销" disabled>↶</button>
        <button id="btnRedo" type="button" aria-label="重做" title="重做" disabled>↷</button>
      </div>
      <!-- 自由裁剪：框只覆盖照片本身（进裁剪时画布切成「只画照片」），
           所以这里的百分比就是照片的百分比，导出时按同一组比例重放 -->
      <div id="cropLayer" hidden>
        <div class="crop-dim" data-dim="t"></div>
        <div class="crop-dim" data-dim="b"></div>
        <div class="crop-dim" data-dim="l"></div>
        <div class="crop-dim" data-dim="r"></div>
        <div id="cropBox">
          <div class="crop-grid"></div>
          <span class="crop-h" data-ch="nw"></span>
          <span class="crop-h" data-ch="ne"></span>
          <span class="crop-h" data-ch="sw"></span>
          <span class="crop-h" data-ch="se"></span>
        </div>
      </div>
      <div id="cropBar" hidden>
        <div class="chips crop-ratios" id="cropRatios"></div>
        <div class="crop-acts">
          <button id="btnCropCancel" type="button">取消</button>
          <button id="btnCropApply" class="act-btn primary" type="button">应用裁剪</button>
        </div>
      </div>
    </section>

    <div id="filmstrip" class="filmstrip" hidden></div>

    <nav id="tabs" aria-label="编辑工具">
      <button class="tab active" data-tab="style"><span class="ico">✦</span>风格</button>
      <button class="tab" data-tab="edit"><span class="ico">▤</span>版式</button>
      <button class="tab" data-tab="grade"><span class="ico">◐</span>调色</button>
      <button class="tab" data-tab="puzzle"><span class="ico">▦</span>拼图</button>
      <button class="tab" data-tab="crop"><span class="ico">⌗</span>切图</button>
    </nav>

    <button id="panelGrip" type="button" aria-label="展开或收起面板"><span></span></button>
    <section id="panel" aria-live="polite"></section>
  </main>

  <!-- ── 我的 ────────────────────────────────────────────────── -->
  <main id="pageMine" class="page mine-page" hidden>
    <div class="mine-scroll">
      <button class="mine-card mine-id" id="mineAvatarRow" type="button">
        <div class="mine-logo"><img id="mineAvatarImg" src="img/avatar.png" alt="用户头像"></div>
        <div class="mine-id-txt">
          <b id="mineAvatarName">设置我的头像</b>
          <span id="mineAvatarHint">用于照片上的「签名 + 头像」风格 · 仅存在本机</span>
        </div>
        <span class="mine-arrow">›</span>
      </button>

      <section class="mine-group">
        <h3>用户资料</h3>
        <button class="mine-row" id="mineProfileRow" type="button">
          <span class="mine-ico">✎</span><span class="mine-label">昵称与签名</span><em id="mineProfileSum">未设置</em><span class="mine-arrow">›</span>
        </button>
      </section>

      <section class="mine-group">
        <h3>我的内容</h3>
        <button class="mine-row" id="mineStylesRow" type="button">
          <span class="mine-ico">✦</span><span class="mine-label">我的风格</span><em id="mineStylesCount">0</em><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="mineGradesRow" type="button">
          <span class="mine-ico">◐</span><span class="mine-label">我的调色</span><em id="mineGradesCount">0</em><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="minePhotosRow" type="button">
          <span class="mine-ico">▧</span><span class="mine-label">照片库</span><em id="minePhotosCount">0</em><span class="mine-arrow">›</span>
        </button>
      </section>

      <section class="mine-group">
        <h3>应用设置</h3>
        <button class="mine-row" id="btnOpenExport" type="button">
          <span class="mine-ico">⇩</span><span class="mine-label">导出画质</span><em id="mineExportSum">原图 · JPEG</em><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="mineFocalRow" type="button">
          <span class="mine-ico">⌖</span><span class="mine-label">焦距类型</span><em id="mineFocalSum">原始焦距</em><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="mineLogoRow" type="button">
          <span class="mine-ico">▣</span><span class="mine-label">我的 Logo</span><em>到元素页添加</em><span class="mine-arrow">›</span>
        </button>
      </section>

      <section class="mine-group">
        <h3>样式</h3>
        <button class="mine-row" id="btnShareStyle" type="button">
          <span class="mine-ico">⤴</span><span class="mine-label">复制当前样式分享码</span><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="btnImportStyle" type="button">
          <span class="mine-ico">⤵</span><span class="mine-label">从分享码导入</span><span class="mine-arrow">›</span>
        </button>
      </section>

      <section class="mine-group">
        <h3>系统设置</h3>
        <button class="mine-row" id="btnUserTerms" type="button">
          <span class="mine-ico">§</span><span class="mine-label">用户协议</span><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="btnPrivacy" type="button">
          <span class="mine-ico">◇</span><span class="mine-label">隐私政策</span><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="btnAbout" type="button">
          <span class="mine-ico">◎</span><span class="mine-label">关于我们</span><span class="mine-arrow">›</span>
        </button>
        <button class="mine-row" id="btnChangelog" type="button">
          <span class="mine-ico">≡</span><span class="mine-label">更新内容</span><span class="mine-arrow">›</span>
        </button>
        <div class="mine-row mine-row-static"><span class="mine-ico">⌁</span><span class="mine-label">运行平台</span><em id="minePlatform">web</em></div>
        <div class="mine-row mine-row-static"><span class="mine-ico">◇</span><span class="mine-label">版本</span><em>0.1 · 内测版</em></div>
      </section>
    </div>
  </main>

  <!-- 底部胶囊导航 -->
  <nav id="tabbar" aria-label="主导航">
    <button class="nav-item active" data-page="home" type="button"><span class="nav-ico">⌂</span><span>首页</span></button>
    <button class="nav-item" data-page="edit" type="button"><span class="nav-ico">◨</span><span>编辑</span></button>
    <button class="nav-item" data-page="mine" type="button"><span class="nav-ico">☺</span><span>我的</span></button>
  </nav>

  <div id="toast" hidden role="status"></div>
</div>

<!-- 导出选项：范围 / 长边 / 格式 / 画质；记住上次选择 -->
<div id="exportSheet" class="modal" hidden>
  <div class="modal-mask" data-export-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="导出设置">
    <h2>导出</h2>
    <div class="opt-row" id="rowScope" hidden><label>范围</label>
      <div class="chips" id="optScope">
        <button class="chip" data-scope="current">当前一张</button>
        <button class="chip" data-scope="all">全部</button>
      </div>
    </div>
    <div class="opt-row"><label>长边</label>
      <div class="chips" id="optSize">
        <button class="chip" data-size="0">原图</button>
        <button class="chip" data-size="8192">8192</button>
        <button class="chip" data-size="4096">4096</button>
        <button class="chip" data-size="4000">4000</button>
        <button class="chip" data-size="2000">2000</button>
        <button class="chip" data-size="1080">1080</button>
      </div>
    </div>
    <div class="opt-row"><label>格式</label>
      <div class="chips" id="optFormat">
        <button class="chip" data-format="jpeg">JPEG</button>
        <button class="chip" data-format="png">PNG</button>
        <button class="chip" data-format="webp">WebP</button>
      </div>
    </div>
    <div class="opt-row" id="rowColorSpace"><label>色域</label>
      <div class="chips" id="optColorSpace">
        <button class="chip" data-colorspace="srgb">sRGB</button>
        <button class="chip" data-colorspace="p3">Display P3</button>
        <button class="chip" data-colorspace="adobergb">Adobe RGB</button>
      </div>
    </div>
    <div class="opt-row" id="rowQuality"><label>画质</label>
      <div class="chips" id="optQuality">
        <button class="chip" data-quality="0.92">高</button>
        <button class="chip" data-quality="0.85">标准</button>
        <button class="chip" data-quality="0.75">小体积</button>
      </div>
    </div>
    <p class="panel-note" id="exportHint">—</p>
    <div class="modal-acts">
      <button id="btnExportCancel" type="button">取消</button>
      <button id="btnExportGo" class="act-btn primary" type="button">保存 / 分享</button>
    </div>
  </div>
</div>

<!-- 用户头像：方形裁剪，结果存本机，供「签名 + 头像」系列风格叠加 -->
<div id="avatarSheet" class="modal" hidden>
  <div class="modal-mask" data-avatar-close></div>
  <div class="modal-card avatar-modal" role="dialog" aria-modal="true" aria-label="设置头像">
    <h2>设置头像</h2>
    <p class="panel-note">用于照片上的签名 + 头像风格 · 只保存在本机</p>
    <div id="avatarCropStage" class="avatar-crop-stage"><img id="avatarCropImg" alt="待裁剪头像"></div>
    <div class="avatar-zoom-row">
      <label for="avatarZoom">缩放</label>
      <input id="avatarZoom" type="range" min="100" max="400" step="1" value="100">
      <output id="avatarZoomVal">100%</output>
    </div>
    <div class="modal-acts">
      <button id="btnAvatarCancel" type="button">取消</button>
      <button id="btnAvatarPick" type="button">换一张</button>
      <button id="btnAvatarClear" type="button">移除</button>
      <button id="btnAvatarOk" class="act-btn primary" type="button">使用</button>
    </div>
  </div>
</div>

<!-- 引擎与算法：与桌面端同源，由 tools/sync-mobile-engine.js 同步，禁止手改 -->
<div id="gridControls" hidden aria-hidden="true">
  <select id="selGridSize"><option value="3" selected>3</option></select>
  <input id="inpGridCols" value="3">
  <input id="inpGridRows" value="3">
  <input id="slGridPad" value="0">
  <input id="slGridOffsetX" value="0">
  <input id="slGridOffsetY" value="0">
</div>
<script src="js/capacitor.js"></script>
<script src="js/default-template.js"></script>
<script src="js/presets-bundle.js"></script>
<script src="js/wall-data.js"></script>
<script src="js/heic-bridge.js"></script>
<script src="js/native.js"></script>
<script src="js/app-stub.js"></script>
<script src="js/app-auto-grade.js"></script>
<script src="js/app-sharpen.js"></script>
<script src="js/app-curve.js"></script>
<script src="js/app-grade.js"></script>
<script src="js/app-histogram.js"></script>
<script src="js/app-export.js"></script>
<script src="js/color-space.js"></script>
<script src="js/icc-embed.js"></script>
<script src="js/qfs-img.js"></script>
<script src="js/exif.js"></script>
<script src="js/focal-eq.js"></script>
<script src="js/presets.js"></script>
<script src="js/style-caps.js"></script>
<script src="js/style-params.js"></script>
<script src="js/engine.js"></script>
<script src="js/engine-styles.js"></script>
<script type="module" src="js/raw-bridge.js"></script>
<script src="js/fullres.js"></script>
<script src="js/edit-panel.js"></script>
<script src="js/grade-extra.js"></script>
<script src="js/avatar.js"></script>
<script src="js/changelog.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
